    <!-- Bakım Modu Sistemi (En Tepede) -->
    <style id="bakim-blocking-style">
        
    </style>
    <script src="../../../bakim-ayari.js?v=1766778190"></script>
    <script>
        (function () {
            // Bakım sayfası ise kontrol etme
            if (window.location.pathname.includes('bakimda.html')) return;

            const isAuthorized = localStorage.getItem('admin_session') ||
                localStorage.getItem('adminToken') ||
                localStorage.getItem('token');
            const urlParams = new URLSearchParams(window.location.search);
            const hasBypass = urlParams.has('lidareyn_ozel_girisKask12121O');

            if (hasBypass) {
                localStorage.setItem('admin_session', 'active_' + Date.now());
                const cleanUrl = window.location.pathname; 
                window.history.replaceState(null, '', cleanUrl); // URL'i temizle
                document.getElementById('bakim-blocking-style').remove();
                return;
            }

            if (window.BAKIM_MODU_AKTIF === true && !isAuthorized) {
                window.location.href = '../../../bakimda.html';
                return;
            }

            // Eğer bakımda değilse veya yetkiliyse sayfayı göster
            const style = document.getElementById('bakim-blocking-style');
            if (style) style.remove();
            console.log('🔧 Bakım Modu: Erişim onaylandı.');
        })();
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetici Girişi - Resels</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
    <meta property="og:image" content="../../../gorseller/sosyal_medya_gorseli.png">
</head>

<body>

    <div class="login-page">
        <div class="login-card">
            <span class="login-logo">Resels Admin</span>
            <p class="login-subtitle">Yönetim paneline erişmek için giriş yapın</p>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>E-Posta Adresi</label>
                    <input type="email" class="form-control" placeholder="admin@resels.com" value="admin@resels.com"
                        required>
                </div>

                <div class="form-group">
                    <label>Şifre</label>
                    <input type="password" class="form-control" placeholder="••••••••" value="password" required>
                </div>

                <button type="submit" class="btn-primary">Giriş Yap</button>
            </form>

            <p style="margin-top: 24px; font-size: 13px; color: #9ca3af;">
                <a href="../index.html" style="text-decoration: underline;">Siteye Dön</a>
            </p>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            // In a real app, validation would happen here
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
