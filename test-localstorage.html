<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>LocalStorage Test</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
            background: #f5f5f5;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            color: #333;
        }

        .key {
            background: #e3f2fd;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }

        .key strong {
            color: #1976d2;
        }

        .data {
            background: #f5f5f5;
            padding: 10px;
            margin-top: 5px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow: auto;
        }

        .empty {
            color: #999;
            font-style: italic;
        }

        .count {
            color: #4caf50;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔍 LocalStorage Ürün Verisi Kontrolü</h1>
        <p>Bu sayfa localStorage'da kayıtlı ürün verilerini gösterir.</p>

        <div id="results"></div>
    </div>

    <script>
        const results = document.getElementById('results');
        const keysToCheck = ['galatacarsi_products', 'galata_products', 'galata_products_cache', 'products'];

        let html = '';
        let foundAny = false;

        keysToCheck.forEach(key => {
            const data = localStorage.getItem(key);

            html += `<div class="key">`;
            html += `<strong>Anahtar: "${key}"</strong><br>`;

            if (data) {
                try {
                    const parsed = JSON.parse(data);
                    if (Array.isArray(parsed)) {
                        html += `<span class="count">✅ ${parsed.length} ürün bulundu!</span>`;
                        html += `<div class="data">`;
                        html += `İlk 3 ürün:<br>`;
                        parsed.slice(0, 3).forEach((p, i) => {
                            html += `${i + 1}. ${p.name || 'İsimsiz'} - ${p.brand || 'Markas yok'}<br>`;
                            html += `   Resim: ${p.mainImage || p.image || 'YOK'}<br>`;
                        });
                        html += `</div>`;
                        foundAny = true;
                    } else {
                        html += `<span class="empty">❌ Veri array değil</span>`;
                    }
                } catch (e) {
                    html += `<span class="empty">❌ JSON parse hatası: ${e.message}</span>`;
                }
            } else {
                html += `<span class="empty">❌ Veri yok</span>`;
            }

            html += `</div>`;
        });

        if (!foundAny) {
            html += `<div style="background: #fff3cd; padding: 15px; border-radius: 8px; margin-top: 20px; border: 2px solid #ffc107;">`;
            html += `<strong>⚠️ HİÇBİR ANAHTARDA ÜRÜN VERİSİ BULUNAMADI!</strong><br><br>`;
            html += `Bu durumda:<br>`;
            html += `1. Admin panelinden (admin/products.html) en az bir ürün ekleyin.<br>`;
            html += `2. "Kaydet" butonuna basın.<br>`;
            html += `3. Bu sayfayı yenileyin ve veriyi kontrol edin.<br>`;
            html += `</div>`;
        }

        results.innerHTML = html;
    </script>
</body>

</html>
